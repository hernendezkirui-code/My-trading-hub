<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trading Hub</title>
  <style>
    body {
      background-color: #0e0e12;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #181c24;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .status {
      font-size: 1.1em;
      color: #00e676;
    }
    button {
      background-color: #ff444f;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>My Trading Hub</h1>
    <p>App ID: <code>34yqguMoomzjEFCrdww9T</code></p>
    <div id="status" class="status">Connecting to Deriv WS...</div>
    <button onclick="pingDeriv()">Ping Deriv API</button>
  </div>

  <script>
    const appId = '34yqguMoomzjEFCrdww9T';
    const socket = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

    socket.onopen = function(e) {
      document.getElementById('status').innerText = 'Connected to Deriv Server Successfully!';
    };

    socket.onmessage = function(event) {
      const data = JSON.parse(event.data);
      if (data.msg_type === 'ping') {
        alert('Deriv API Response: ' + data.ping);
      }
    };

    socket.onerror = function(error) {
      document.getElementById('status').innerText = 'Connection Error';
      document.getElementById('status').style.color = '#ff444f';
    };

    function pingDeriv() {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ ping: 1 }));
      } else {
        alert('Socket not connected yet.');
      }
    }
  </script>

</body>
</html>
